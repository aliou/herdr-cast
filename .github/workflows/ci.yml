name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup component add rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt -- --check

      - name: Test
        run: cargo test

  binaries:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: herdr-cast-darwin-arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: herdr-cast-linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: herdr-cast-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Test target
        run: cargo test --target ${{ matrix.target }}

      - name: Build target
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/herdr-cast" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"

      - name: Upload to the unstable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Four jobs race to create the release; losing the race is fine as
          # long as the release exists by the time we upload.
          if ! gh release view unstable >/dev/null 2>&1; then
            gh release create unstable --prerelease --title unstable \
              --notes "Rolling build of the main branch. Do not use as a changelog." \
              || gh release view unstable >/dev/null
          fi
          gh release upload unstable "${{ matrix.artifact }}" --clobber

  assets:
    name: Bundle HerdrNotify.app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package the bundled notifier app
        run: |
          set -euo pipefail
          mkdir -p stage/libexec
          cp -R assets/HerdrNotify.app stage/libexec/HerdrNotify.app
          chmod +x stage/libexec/HerdrNotify.app/Contents/MacOS/terminal-notifier
          tar -czf stage/herdr-cast-assets-darwin.tar.gz -C stage/libexec HerdrNotify.app

      - name: Upload to the unstable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view unstable >/dev/null 2>&1; then
            gh release create unstable --prerelease --title unstable \
              --notes "Rolling build of the main branch. Do not use as a changelog." \
              || gh release view unstable >/dev/null
          fi
          gh release upload unstable stage/herdr-cast-assets-darwin.tar.gz --clobber
