id = "aliou.cast"
name = "Cast"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Aliou's herdr customization hub. Native turn-end / needs-input notifications that jump to the right pane on click."
platforms = ["macos"]

# Build the single Rust binary used by every plugin entrypoint.
[[build]]
command = ["cargo", "build", "--release"]
platforms = ["macos"]

# Fire a native notification whenever a pane's agent status changes. The
# handler filters to the hard-coded blocked and done statuses.
[[events]]
on = "pane.agent_status_changed"
command = ["./target/release/herdr-cast", "notify"]

# A searchable popup palette for layout operations on the focused pane.
[[panes]]
id = "layout-palette"
title = "Layout palette"
platforms = ["macos"]
placement = "popup"
width = "60%"
height = 12
command = ["./target/release/herdr-cast", "palette"]
