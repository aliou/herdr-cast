id = "ad.cast"
name = "Cast"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Personal Herdr customizations with native agent notifications and workspace tools."
platforms = ["macos"]

# Build the single Rust binary used by every plugin entrypoint.
[[build]]
command = ["cargo", "build", "--release"]
platforms = ["macos"]

# Fire a native notification whenever a pane's agent status changes. The
# handler filters to the hard-coded blocked and done statuses.
[[events]]
on = "pane.agent_status_changed"
command = ["./target/release/herdr-cast", "notify"]

# A searchable popup palette for layout operations on the focused pane.
[[panes]]
id = "layout-palette"
title = "Layout palette"
platforms = ["macos"]
placement = "popup"
width = 44
height = 7
command = ["./target/release/herdr-cast", "palette"]

# Fuzzy-select a zoxide-ranked directory and create a workspace there.
[[panes]]
id = "directory-workspace"
title = "New workspace"
platforms = ["macos"]
placement = "popup"
width = "37%"
height = "33%"
command = ["./target/release/herdr-cast", "directory-workspace"]

# Fuzzy-select and focus any workspace in the current Herdr session.
[[panes]]
id = "workspace-picker"
title = "Switch workspace"
platforms = ["macos"]
placement = "popup"
width = "37%"
height = "33%"
command = ["./target/release/herdr-cast", "workspace-picker"]
