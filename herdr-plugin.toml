id = "ad.cast"
name = "Cast"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Personal Herdr customizations with agent notifications and workspace tools."
platforms = ["macos", "linux"]

# Build the single Rust binary used by every plugin entrypoint.
[[build]]
command = ["cargo", "build", "--release"]
platforms = ["macos", "linux"]

# Rebuild every Space's sidebar metadata. Herdr drops metadata tokens when a
# new server restores a session, so without this the second Space row stays
# empty until something reports again.
[[startup]]
command = ["herdr-cast", "sync-spaces"]

# Own the foreground terminal window title from the first moment a server
# runs: push the composed title and spawn the per-session title daemon.
[[startup]]
command = ["herdr-cast", "sync-title"]

# Fire a notification whenever a pane's agent status changes. The handler
# filters to the hard-coded blocked and done statuses.
[[events]]
on = "pane.agent_status_changed"
command = ["herdr-cast", "notify"]

# Label a Space as soon as it exists.
[[events]]
on = "workspace.created"
command = ["herdr-cast", "sync-space"]

# Catch anything the shell integration missed, such as a remote session
# started outside an interactive prompt. `pane.updated` would be the precise
# signal, but Herdr withholds it from plugin hooks as a high-volume event.
[[events]]
on = "workspace.focused"
command = ["herdr-cast", "sync-space"]

# React to focus changes. One coordinator fans out to every feature that
# cares: the recency log for the workspace picker's ordering, clearing a
# delivered macOS notification for the visited pane, and an instant window
# title refresh (the per-session title daemon keeps it current between
# events; Herdr withholds `pane.updated`, so only its poll sees a program
# setting a new terminal title).
[[events]]
on = "pane.focused"
command = ["herdr-cast", "pane-focused"]

# A closed pane can no longer be visited, so its notification is no longer
# actionable and its outstanding state should not outlive it.
[[events]]
on = "pane.closed"
command = ["herdr-cast", "clear-notification"]

# The terminal window title is owned by the title daemon (`sync-title`,
# spawned at startup and re-ensured on focus events); it no longer tracks
# the workspace label, so it needs no workspace event subscriptions.

# A searchable popup palette for layout operations on the focused pane.
[[panes]]
id = "layout-palette"
title = "Layout palette"
platforms = ["macos", "linux"]
placement = "popup"
width = 44
height = 10
command = ["herdr-cast", "palette"]

# Fuzzy-select a zoxide-ranked directory and create a workspace there.
#
# width/height here are only a fallback for direct `plugin.pane.open` calls
# that omit sizing. The keybinding in config.toml instead opens this pane
# through `herdr-cast open-popup`, which clamps 37%/33% of the terminal area
# to a minimum cell size so the popup stays usable on small screens.
[[panes]]
id = "directory-workspace"
title = "New workspace"
platforms = ["macos", "linux"]
placement = "popup"
width = "37%"
height = "33%"
command = ["herdr-cast", "directory-workspace"]

# Fuzzy-select and focus any workspace in the current Herdr session.
# See the sizing note above: config.toml opens this via `open-popup` too.
[[panes]]
id = "workspace-picker"
title = "Switch workspace"
platforms = ["macos", "linux"]
placement = "popup"
width = "37%"
height = "33%"
command = ["herdr-cast", "workspace-picker"]

# Open lazygit against the focused pane's own repository, or, when it isn't
# inside one, fuzzy-pick a repository found up to 3 levels below it. Replaces
# a bare `command = "lazygit"` popup key, which errors outside a repository.
[[panes]]
id = "lazygit"
title = "lazygit"
platforms = ["macos", "linux"]
placement = "popup"
width = "90%"
height = "90%"
command = ["herdr-cast", "lazygit"]
