[package]
name = "herdr-cast"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
